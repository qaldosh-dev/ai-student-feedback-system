spring.application.name=student-feedback
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_feedback}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates missing tables and keeps existing data between restarts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Sample records are inserted only when all three catalog tables are empty.
app.seed.enabled=${SEED_ENABLED:true}
