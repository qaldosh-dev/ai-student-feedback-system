spring.application.name=student-feedback
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/student_feedback}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Legacy local mode until explicit schema adoption. New/adopted environments MUST use
# the db-managed profile (validate); see backend/sql/README.md before changing databases.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Sample records are inserted only when all three catalog tables are empty.
app.seed.enabled=${SEED_ENABLED:true}
app.dev-accounts.enabled=${DEV_ACCOUNTS_ENABLED:false}

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# Missing SMTP settings do not prevent login/catalog startup; registration sends fail safely.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=${SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${SMTP_STARTTLS_ENABLED:true}
spring.mail.properties[mail.smtp.starttls.required]=${SMTP_STARTTLS_ENABLED:true}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
spring.mail.properties[mail.debug]=false
app.verification.from=${SMTP_FROM:}

# Private local files, outside source/static resources; independent of the working directory.
app.schedule-upload.directory=${SCHEDULE_UPLOAD_DIR:${user.home}/.student-feedback/schedule-uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Parser diagnostics may contain fragments of private PDF content. Only safe application reasons are exposed.
logging.level.org.apache.pdfbox=OFF
logging.level.org.apache.fontbox=OFF

# Backend-only moderation; missing credentials leave reviews SUBMITTED. One bounded attempt.
app.moderation.gemini.api-key=${GEMINI_API_KEY:}
app.moderation.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.moderation.gemini.timeout-ms=8000
